name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Run the corpus
        run: java -jar target/logik-core-*.jar src/test/resources/corpus > corpus-output.txt
      - name: Upload the corpus output
        uses: actions/upload-artifact@v7
        with:
          name: corpus-output-java-${{ matrix.java }}
          path: corpus-output.txt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
